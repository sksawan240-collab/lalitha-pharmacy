services:
  - type: web
    name: lalitha-pharmacy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://lalitha-pharmacy-1.onrender.com,https://lalitha-pharmacy.onrender.com
      - key: BACKEND_URL
        value: https://lalitha-pharmacy.onrender.com

  - type: web
    name: lalitha-pharmacy-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_API_URL
        value: https://lalitha-pharmacy.onrender.com/api
